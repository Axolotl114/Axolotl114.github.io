name: Build & Deploy to GitHub Pages

# main = 源码分支；每次推送 main 都会：
#   1) 用 pnpm 安装依赖（Node 22 + pnpm 版本取自 package.json 的 packageManager）
#   2) pnpm build（含 LQIP、字体子集、Pagefind 索引、体积检查）
#   3) 把 dist/ 发布到 gh-pages 分支
# Pages 的 Source 仍然是「gh-pages 分支」（Settings → Pages → Build and deployment
# → Deploy from a branch: gh-pages /），不是 “GitHub Actions” 部署方式：
#   - 这样站点不会因为切换部署方式出现空窗；
#   - gh-pages 里只需要站点文件（不需要 runner 权限），GitHub 的 legacy 构建会照常
#     提供 https://axolotl114.github.io/；
#   - `.nojekyll` 由 peaceiris 动作自动写入，保证 `_astro/` 不被 Jekyll 吞掉。
# 也可以手动触发：Actions → Build & Deploy to GitHub Pages → Run workflow。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 contents: write 才能把构建产物推到 gh-pages
permissions:
  contents: write

# 同一分支只保留最新一次构建；取消进行中的旧任务，避免并发推 gh-pages 冲突
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@11.22.0），无需再传 version
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_yes: "true" # preinstall 的 `npx only-allow pnpm` 不交互

      - name: Build site
        run: pnpm build
        env:
          npm_config_yes: "true"
          # 构建链里 generate-github-card-data.ts 会请求 api.github.com，
          # 带上 token 可避免匿名 60 次/小时限流（失败也有本地缓存兜底）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: false # 保留 gh-pages 历史，正常追加提交
          enable_jekyll: false # 自动写 .nojekyll，_astro/ 才能在 Pages 上访问
          commit_message: "deploy: ${{ github.sha }}"

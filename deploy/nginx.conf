# =============================================================================
# Axo 博客 — moebun 宝塔虚拟主机 Nginx 配置
# 站点: https://axo.dpdns.org/   产物: Astro static -> dist/
# -----------------------------------------------------------------------------
# 用法（二选一）：
#   A. 宝塔面板 -> 网站 -> axo.dpdns.org -> 设置 -> 配置文件：
#      在 server { ... } 内部、`#REWRITE-END` 之后粘贴【第 1 部分】的片段；
#      （宝塔自带的 `location ~ .*\.(js|css)?$` 等规则保留即可，本片段的
#       `location ^~ ...` 优先级高于正则 location，不会冲突。）
#   B. 宝塔面板 -> 网站 -> 设置 -> 伪静态：粘贴【第 1 部分】的片段
#      （伪静态文件同样被 include 进 server 块，location 指令可用）。
#
# 生产粘贴请用无注释纯 ASCII 版：deploy/nginx-site.conf（整份复制即可）。
# 注意：本文件不是完整的 nginx.conf，不能直接替换主配置。
#       【第 2 部分】只是完整 server 块的形态参考。
# =============================================================================


# =============================================================================
# 第 1 部分：可直接粘贴的配置片段（server 块内部）
# =============================================================================

# --- 1. 静态站点默认首页 -----------------------------------------------------
index index.html;

# --- 2. 路由：Astro 是 output:'static' + trailingSlash:'always' -------------
# 构建产物形如 dist/posts/hello/index.html，对外规范 URL 为 /posts/hello/
#   请求 /posts/hello/  -> $uri 是目录，命中 $uri/ 后由 index 提供 index.html
#   请求 /posts/hello   -> 目录存在但缺结尾斜杠：301 跳到 /posts/hello/（规范 URL）
#   请求 /rss.xml 等    -> 命中 $uri 精确文件
#   /xxx.html           -> 兼容个别 .html 单文件产物
#   其余一律交给 404 处理（见下方 error_page 404）
#
# 说明：`if (-d ...) { rewrite ... permanent; }` 是 Nginx 中 if 的少数安全用法
# （纯 rewrite，无其他指令），用于把“目录但无结尾斜杠”的请求 301 到带斜杠 URL，
# 保证 /posts/x 与 /posts/x/ 不会产生两个可索引地址（SEO 规范化）。
location / {
    if (-d $request_filename) {
        rewrite ^(.*[^/])$ $1/ permanent;
    }
    # 用 =404 而不是 /404.html：try_files 的最后一项若是 URI 会做内部跳转并返回 200，
    # 用 =404 才能保证不存在的 URL 返回真正的 HTTP 404 状态码，
    # 再由下面的 error_page 404 /404.html 输出自定义 404 页面。
    try_files $uri $uri/ $uri.html =404;
}

# --- 3. 404 页面 -------------------------------------------------------------
error_page 404 /404.html;

# 404.html 仅作为内部错误页使用，直接访问 /404.html 仍返回 404
location = /404.html {
    internal;
}

# --- 4. 构建产物 _astro/：文件名带内容哈希，可长期强缓存 --------------------
location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# --- 5. Pagefind 搜索索引（纯静态，随站点一起上传） --------------------------
# pagefind-entry.json 文件名不带哈希，必须禁止强缓存，否则站点更新后
# 旧 entry 会指向已删除的索引分片，站内搜索会 404。
location = /pagefind/pagefind-entry.json {
    add_header Cache-Control "no-cache, must-revalidate";
}

# 分片文件（zh-cn_<hash>.pf_fragment / .pf_index / .pf_meta）与 wasm 可以缓存
location ^~ /pagefind/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
}

# --- 6. .wasm MIME 兜底 ------------------------------------------------------
# 虚拟主机默认 mime.types 里可能没有 wasm。当前 Pagefind 1.5.x 的 wasm 文件名为
# `wasm.unknown.pagefind`（以 ArrayBuffer 方式加载，不依赖扩展名 MIME），
# 但升级后可能变成 *.wasm，这里提前兜底，避免 instantiateStreaming 报
# "Incorrect response MIME type"。
types {
    application/wasm wasm;
}

# --- 7. HTML 不缓存（内容随每次发布变化，且没有哈希文件名） -----------------
# 说明：try_files 内部跳转到 /xxx/index.html 后仍会命中本 location，
# 因此所有 HTML 都会带上 no-cache 头。
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
}

# --- 8. 其他静态资源（可选） -------------------------------------------------
location ^~ /assets/fonts/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location ^~ /images/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

# --- 9. gzip 压缩 ------------------------------------------------------------
# 宝塔默认通常已开启 gzip，这里是显式版本（放在 server 块内同样生效）。
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    application/wasm
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

# --- 10. 与模板 vercel.json 对齐的安全头（可选，纯静态站点同样有效） ---------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;


